name: CI

on:
  workflow_dispatch:
  schedule:
    - cron: '0 18 * * 5'  # "At 18:00 on Friday."
  pull_request:
  push:
    branches:
      - main
      - py2-legacy
      - v3.x
    tags:
      - "*.*.*"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.x"
      - uses: pre-commit/action@2c7b3805fd2a0fd8c1884dcaebf91fc102a13ecd # v3.0.1


  build_wheels:
    name: Build ${{ matrix.build }}${{ matrix.arch }} wheels on ${{ matrix.os }}
    needs: [lint]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            arch: "x86_64"
            build: "manylinux_"
          - os: ubuntu-latest
            arch: "x86_64"
            build: "musllinux_"
          - os: ubuntu-latest
            arch: "i686"
            build: "manylinux_"
          - os: ubuntu-latest
            arch: "i686"
            build: "musllinux_"
          - os: ubuntu-24.04-arm
            arch: "aarch64"
            build: "manylinux_"
          - os: ubuntu-24.04-arm
            arch: "aarch64"
            build: "musllinux_"
          - os: ubuntu-24.04-arm
            arch: "ppc64le"
            build: "manylinux_"
          - os: ubuntu-24.04-arm
            arch: "ppc64le"
            build: "musllinux_"
          - os: ubuntu-24.04-arm
            arch: "s390x"
            build: "manylinux_"
          - os: ubuntu-24.04-arm
            arch: "s390x"
            build: "musllinux_"
          - os: ubuntu-24.04-arm
            arch: "riscv64"
            build: "manylinux_"
          - os: ubuntu-24.04-arm
            arch: "riscv64"
            build: "musllinux_"
          - os: ubuntu-24.04-arm
            arch: "armv7l"
            build: "manylinux_"
          - os: ubuntu-24.04-arm
            arch: "armv7l"
            build: "musllinux_"
          - os: windows-2022
            arch: "AMD64"
            build: ""
          - os: windows-11-arm
            arch: "ARM64"
            build: ""
          - os: windows-2022
            arch: "x86"
            build: ""
          - os: macos-14
            arch: "universal2"
            build: ""

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0  # required for versioneer to find tags
          persist-credentials: false

      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          enable-cache: false

      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        if: matrix.arch == 'ppc64le' || matrix.arch == 'riscv64' || matrix.arch == 's390x'

      - name: Build wheels
        uses: pypa/cibuildwheel@f9b966cfadf4109556cadc5bb39ddb72d0ce664e # v4.3.5
        env:
          CIBW_ARCHS: "${{ matrix.arch }}"
          CIBW_BUILD: "cp310-${{ matrix.build }}*"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cibw-${{ runner.os }}-${{ matrix.build }}${{ matrix.arch }}
          path: ./wheelhouse/*.whl

  build_sdist:
    name: Build source distribution
    needs: [lint]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0  # required for versioneer to find tags
          persist-credentials: false

      - name: Build SDist
        run: pipx run build --sdist

      - name: Check bundled CMake source archive
        run: tar tzf dist/*.tar.gz | grep -E '/archive-cache/cmake-[0-9.]+\.tar\.gz$'

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cibw-sdist
          path: dist/*.tar.gz

  test_sdist:
    name: Test SDist with python ${{ matrix.python }}
    needs: [build_sdist]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.8", "3.13"]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          enable-cache: false

      - name: Setup environment
        run: |
          uv venv --python ${{ matrix.python }}
          uv pip install --group test

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libssl-dev

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: cibw-sdist
          path: dist

      # Dead proxy blocks the CMake download; PyPI stays reachable for build deps.
      - name: Install SDist (offline, from bundled source)
        env:
          CMAKE_ARGS: "-DBUILD_CMAKE_FROM_SOURCE:BOOL=ON"
          CMAKE_BUILD_PARALLEL_LEVEL: "4"
          http_proxy: "http://127.0.0.1:9"
          https_proxy: "http://127.0.0.1:9"
          no_proxy: "pypi.org,files.pythonhosted.org"
        run: |
          uv pip install dist/*.tar.gz
          rm -rf dist

      - name: Test installed SDist
        run: .venv/bin/pytest ./tests

  bootstrap_build:
    name: Source only build on ${{ matrix.os }}
    needs: [lint]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: ["ubuntu-latest", "windows-latest", "macos-latest"]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        id: python
        with:
          python-version: "3.x"

      - name: Remove cmake and ninja
        shell: bash
        run: |
          # Remove cmake and ninja
          set -euxo pipefail
          # https://github.com/scikit-build/scikit-build-core/blob/3943920fa267dc83f9295279bea1c774c0916f13/src/scikit_build_core/program_search.py#L51
          # https://github.com/scikit-build/scikit-build-core/blob/3943920fa267dc83f9295279bea1c774c0916f13/src/scikit_build_core/program_search.py#L70
          for TOOL in cmake cmake3 ninja-build ninja samu; do
            while which ${TOOL}; do
              if [ "$RUNNER_OS" == "Windows" ]; then
                rm -f "$(which ${TOOL})"
              else
                sudo rm -f $(which -a ${TOOL})
              fi
            done
          done

      - name: Build SDist
        run: pipx run --python "${PYTHON}" build --sdist
        env:
          PYTHON: "${{ steps.python.outputs.python-path }}"

      - name: Install dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libssl-dev

      - name: Install SDist
        shell: bash
        env:
          CMAKE_ARGS: "-DBUILD_CMAKE_FROM_SOURCE:BOOL=OFF"
          CMAKE_BUILD_PARALLEL_LEVEL: "4"
          MACOSX_DEPLOYMENT_TARGET: "10.10"
        run: |
          python -m pip install -v --no-binary='cmake,ninja' dist/*.tar.gz
          rm -rf dist

      - name: Test installed SDist
        shell: bash
        run: python -m pip install pytest pytest-cov && pytest ./tests

  check_dist:
    name: Check dist
    needs: [build_wheels, build_sdist, test_sdist, bootstrap_build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: cibw-*
          merge-multiple: true
          path: dist

      - run: pipx run twine check --strict dist/*

  upload_pypi:
    name: Upload to PyPI
    needs: [check_dist]
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.repository == 'scikit-build/cmake-python-distributions' && startsWith(github.ref, 'refs/tags/')
    environment:
      name: pypi
      url: https://pypi.org/p/cmake
    permissions:
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: cibw-*
          merge-multiple: true
          path: dist

      - name: Generate artifact attestation for sdist and wheel
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: "dist/cmake-*"

      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          attestations: true
